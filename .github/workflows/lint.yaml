# ==============================================================================
# DEVOPS GATEKEEPER: CI/CD QUALITY ASSURANCE PIPELINE
# ==============================================================================
# WHAT IT DOES:
# 1. Triggers on pushes/PRs to 'main' -> Runs on isolated cloud Ubuntu VMs.
# 2. Clones code, sets up Python 3.11, and installs requirements from ledger.
# 3. Runs Flake8: Catches syntax errors (Fails if Exit Code > 0).
# 4. Runs Mypy: Enforces strict type checking for OOP architecture safety[cite: 1].
# 5. Connects to Repository Rulesets to block broken code from entering production.
#
# TERMINAL COMMAND CHEATSHEET FOR DAILY DEVELOPMENT REVISION:
#   Step A (Create Branch): git checkout -b feature/your-feature-name
#   Step B (Stage Changes): git add .
#   Step C (Commit Changes): git commit -m "feat: short description of work"
#   Step D (Push Sandbox):  git push origin feature/your-feature-name
# ==============================================================================

name: Code Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ] # Triggers whenever someone targets a PR towards main

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      # 1. Pull down your repository files onto the runner
      - name: Check out repository code
        uses: actions/checkout@v4

      # 2. Spin up a dedicated Python environment
      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # 3. Install the tools from your requirements.txt
      - name: Install Linting and Type Checking Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. Enforce strict linting rules
      - name: Run Flake8 Code Linter
        run: |
          # Crucial syntax check: fails the build on critical errors
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Stylistic check: alerts us to style issues without stopping the run
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=88 --statistics

      # 5. Enforce strict type checking on your architecture
      - name: Run Mypy Static Type Verification
        run: mypy .