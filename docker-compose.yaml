version: '3.8'

services:
  agent-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sovereign_agent_api
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONPATH=/app
    command: uvicorn src.agent_endpoint:app --host 0.0.0.0 --port 8000 --reload
    deploy:
      resources:
        limits:
          memory: 512M